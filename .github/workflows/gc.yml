# Garbage collection for the hestia binary cache.
#
# GC must run on the default branch: a PR job's cache scope is read-only
# towards the default branch and dies with the PR, but the default-branch
# scope grows forever without GC.
#
# Adapted from Mic92/hestia's gc.yml (https://github.com/Mic92/hestia):
# instead of building hestia from source we let the action download the
# attestation-verified release binary. The daemon it starts is harmless here
# (no builds happen in this job); HESTIA_BIN points at the binary.
name: Cache GC

# GC handles concurrent pushes, but not a concurrent GC: a second run's
# repack reads race the first run's post-commit pack deletes. Queue manual
# runs behind the nightly one instead of overlapping it.
concurrency:
  group: hestia-gc
  cancel-in-progress: false

on:
  schedule:
    # Daily, off-peak (UTC).
    - cron: "23 3 * * *"
  # Manual runs for debugging and one-off cleanups.
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      # REST cache deletes need actions:write.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@v22
      - uses: Mic92/hestia@v3
        with:
          # Pin the release so the binary download is deterministic and
          # verified against GitHub build attestations.
          version: v3.0.0
      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc \
            ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
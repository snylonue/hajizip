# Build the Linux and Windows packages via Nix and publish a GitHub Release.
#
# Triggers:
#   - push to `master`          -> build + publish a PRE-release (every push)
#   - push of a tag `v0.1.0`     -> build + publish a release with assets
#   - manual `workflow_dispatch` -> build + publish a PRE-release
#
# Published asset (all triggers):
#   hajizip-windows-x86_64.zip  (hajizip-gui.exe, single file — MSVC build via
#                                rust-overlay + cargo-xwin with a FOD-pinned
#                                CRT/SDK cache; WebView2 loader statically
#                                linked, no DLLs to ship. Needs only the
#                                WebView2 Runtime, present on Win10/11.)
#
# The MinGW package (packages.x86_64-linux.windows) is built as a fallback
# health check; the Linux package as a flake health check. Neither is
# published.

name: build-and-release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # Linux package: build-only health check (not published).
      - name: Build Linux package
        run: nix build '.#packages.x86_64-linux.gui' -o result-linux

      # Windows MSVC build (published): single exe, no DLLs. The CRT/SDK
      # download happens once inside the FOD (fixed-output derivation), then
      # everything is cached and offline.
      - name: Build Windows MSVC package
        run: nix build '.#packages.x86_64-linux.windows-msvc' -o result-windows-msvc

      # Windows MinGW build: fallback health check (needs WebView2Loader.dll,
      # not published).
      - name: Build Windows MinGW package (fallback check)
        run: nix build '.#packages.x86_64-linux.windows' -o result-windows-mingw

      - name: Collect Windows artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          # MSVC build: single exe, no WebView2Loader.dll to ship.
          cp result-windows-msvc/bin/hajizip-gui.exe dist/
          (cd dist && zip -q hajizip-windows-x86_64.zip hajizip-gui.exe)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hajizip-dist
          path: dist/

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hajizip-windows-x86_64.zip
          generate_release_notes: true

      # Every push to master (non-tag) publishes a pre-release.
      - name: Publish GitHub Pre-Release (push to master / manual dispatch)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hajizip-windows-x86_64.zip
          tag_name: pre-release-${{ github.run_number }}
          name: "hajizip pre-release #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true

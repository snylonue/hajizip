# Build the Linux and Windows packages via Nix and publish a GitHub Release.
#
# Triggers:
#   - push to `master`          -> build + publish a PRE-release (every push)
#   - push of a tag `v0.1.0`     -> build + publish a release with assets
#   - manual `workflow_dispatch` -> build + publish a PRE-release
#
# Published asset (all triggers):
#   hajizip-windows-x86_64.zip  (hajizip-gui.exe + WebView2Loader.dll, ready
#                                to run on Windows 10/11 with the WebView2
#                                Runtime; built via pkgsCross.mingwW64)
#
# The Linux package is built as a flake health check but NOT published.

name: build-and-release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      # Linux package: build-only health check (not published).
      - name: Build Linux package
        run: nix build '.#packages.x86_64-linux.gui' -o result-linux

      - name: Build Windows package
        run: nix build '.#packages.x86_64-linux.windows' -o result-windows

      - name: Collect Windows artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          # Windows: exe + WebView2Loader.dll side by side (MinGW build).
          (cd result-windows/bin && zip -qr "$GITHUB_WORKSPACE/dist/hajizip-windows-x86_64.zip" .)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hajizip-dist
          path: dist/

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hajizip-windows-x86_64.zip
          generate_release_notes: true

      # Every push to master (non-tag) publishes a pre-release.
      - name: Publish GitHub Pre-Release (push to master / manual dispatch)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hajizip-windows-x86_64.zip
          tag_name: pre-release-${{ github.run_number }}
          name: "hajizip pre-release #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
